<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Inventory and Sales SaaS interface</title>
  <desc id="desc">A dashboard cover showing the product areas: products, stock, sales, and invoices.</desc>
  <rect width="800" height="500" fill="#f8fafc"/>
  <rect width="150" height="500" fill="#111827"/>
  <circle cx="42" cy="45" r="15" fill="#a78bfa"/>
  <rect x="68" y="37" width="58" height="15" rx="7" fill="#fff" opacity=".9"/>
  <g fill="#cbd5e1">
    <rect x="28" y="105" width="92" height="12" rx="6"/>
    <rect x="28" y="145" width="70" height="12" rx="6"/>
    <rect x="28" y="185" width="84" height="12" rx="6"/>
    <rect x="28" y="225" width="64" height="12" rx="6"/>
  </g>
  <text x="195" y="72" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Inventory &amp; Sales</text>
  <text x="195" y="103" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="15">Products · Stock · Sales · Invoices</text>
  <g transform="translate(195 145)">
    <rect width="170" height="105" rx="12" fill="#ede9fe"/>
    <rect x="195" width="170" height="105" rx="12" fill="#dbeafe"/>
    <rect x="390" width="170" height="105" rx="12" fill="#dcfce7"/>
    <g fill="#334155" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">
      <text x="20" y="34">Products</text><text x="215" y="34">Stock</text><text x="410" y="34">Sales</text>
    </g>
  </g>
  <rect x="195" y="285" width="560" height="155" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <g fill="#e2e8f0"><rect x="220" y="320" width="500" height="12" rx="6"/><rect x="220" y="360" width="460" height="12" rx="6"/><rect x="220" y="400" width="485" height="12" rx="6"/></g>
</svg>
