<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Learning Management System interface</title>
  <desc id="desc">A course-platform cover showing courses, chapters, enrollments, and analytics.</desc>
  <rect width="800" height="500" fill="#fafafa"/>
  <rect x="35" y="30" width="730" height="440" rx="18" fill="#fff" stroke="#e5e7eb"/>
  <rect x="35" y="30" width="730" height="65" rx="18" fill="#18181b"/>
  <circle cx="75" cy="62" r="14" fill="#f472b6"/>
  <text x="105" y="70" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Learning Management System</text>
  <text x="75" y="145" fill="#18181b" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Courses</text>
  <g transform="translate(75 180)">
    <rect width="195" height="205" rx="12" fill="#fce7f3"/>
    <rect x="225" width="195" height="205" rx="12" fill="#ede9fe"/>
    <rect x="450" width="195" height="205" rx="12" fill="#dbeafe"/>
    <g fill="#fff"><rect x="20" y="20" width="155" height="85" rx="8"/><rect x="245" y="20" width="155" height="85" rx="8"/><rect x="470" y="20" width="155" height="85" rx="8"/></g>
    <g fill="#3f3f46" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600"><text x="20" y="140">Chapters &amp; video</text><text x="245" y="140">Enrollments</text><text x="470" y="140">Progress &amp; analytics</text></g>
  </g>
</svg>
